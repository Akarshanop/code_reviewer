        }}
      ],
      "partial_matches": [
        {{
          "existing_component": "string",
          "prd_requirement": "string",
          "modifications_needed": ["string"],
          "effort_estimate": "small/medium/large"
        }}
      ]
    }},
    "implementation_blueprint": {{
      "files_to_create": [
        {{
          "path": "string",
          "purpose": "string",
          "template_type": "string",

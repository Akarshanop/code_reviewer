# =============================================================================
# Code Intelligence Platform — Docker Compose
# =============================================================================
#
# Your infrastructure is ALL cloud-hosted:
#   - Supabase Cloud   → SUPABASE_URL in .env
#   - Neo4j Aura       → NEO4J_URI in .env
#   - Qdrant Cloud     → QDRANT_URL in .env
#   - Gemini API       → GEMINI_API_KEY in .env
#
# So this compose file only runs the API server.
# No local database containers needed.
#
# Usage:
#   docker compose up --build        (build + start)
#   docker compose up -d             (start in background)
#   docker compose down              (stop)
#   docker compose logs -f api       (tail logs)
#
# =============================================================================

services:

  # ===========================================================================
  # API Server — the only container you need
  # ===========================================================================
  api:
    # Build from the Dockerfile in docker/ folder, using backend root as context
    build:
      context: .
      dockerfile: docker/Dockerfile

    # Container name shown in Docker Desktop
    container_name: code-intel-api

    # Map port 8000 inside container → port 8000 on your Mac
    # Access the API at http://localhost:8000
    ports:
      - "8000:8000"

    # Load ALL environment variables from your .env file
    # This is how the container gets your Supabase, Neo4j, Qdrant,
    # Gemini API keys etc. without baking them into the image.
    env_file:
      - .env

    # Additional env vars (override or supplement .env)
    environment:
      - PYTHONPATH=/app

    # Mount local folders INTO the container so data persists
    # even when the container is rebuilt or restarted.
    volumes:
      # Cloned GitLab repos persist on your Mac's disk
      - ./data/repos:/app/data/repos

      # Generated PRD/QA PDFs are saved to your Mac's disk
      - ./generated_pdfs:/app/generated_pdfs

      # Google Cloud service account file (read-only mount)
      # Your .env references ./service.json for Vertex AI auth
      - ./service.json:/app/service.json:ro

    # Auto-restart if the container crashes (but not if you manually stop it)
    restart: unless-stopped

    # Docker Desktop shows a green/red health indicator based on this
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/admin/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # Optional LOCAL databases (only if you want local infra)
  #
  # Enable with:
  #   docker compose --profile localdb up -d neo4j qdrant
  #
  # Then point your .env to these:
  #   NEO4J_URI=bolt://localhost:7687
  #   NEO4J_USER=neo4j
  #   NEO4J_PASSWORD=localpassword
  #
  #   QDRANT_URL=http://localhost:6333
  #   QDRANT_API_KEY=   (empty for local)
  # ===========================================================================

  neo4j:
    profiles: ["localdb"]
    image: neo4j:5
    container_name: code-intel-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt (driver connection)
    environment:
      # user: neo4j, password: localpassword
      - NEO4J_AUTH=neo4j/localpassword
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    profiles: ["localdb"]
    image: qdrant/qdrant:latest
    container_name: code-intel-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  neo4j_data:
  qdrant_data:

[project]
name = "code-intel-platform"
version = "0.1.0"
description = "Enterprise Code Intelligence Platform with GraphRAG"
authors = [
    {name = "Akarshan"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "uvicorn>=0.40.0,<0.41.0",
    "fastapi>=0.115.0,<0.116.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "neo4j>=5.19.0,<6.0.0",
    "qdrant-client>=1.16.2,<2.0.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "litellm>=1.50.0,<2.0.0",
    "tree-sitter>=0.21.0,<0.22.0",
    "tree-sitter-languages>=1.9.0,<1.11.0",
    "gitpython>=3.1.46,<4.0.0",
    "supabase>=2.10.0,<3.0.0",
    "langchain>=0.3.0,<1.0.0",
    "sentence-transformers>=2.2.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "tenacity>=8.0.0,<10.0.0",
    "structlog>=24.0.0,<25.0.0",
    "google-cloud-aiplatform>=1.44.0,<2.0.0",
    "google-auth>=2.26.0,<3.0.0",
    "fpdf2>=2.8.0,<3.0.0",
    "weasyprint>=62.0,<63.0",
    "pydyf>=0.11.0,<0.12.0",
    "pygments>=2.17.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "black>=24.0.0,<27.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "ipython>=8.0.0,<10.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
